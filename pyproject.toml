[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-stream-doctor"
version = "0.2.0"
description = "Diagnose broken LLM streaming responses: empty streams, reasoning-only replies, missing finish_reason, malformed SSE, incomplete tool calls."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mohammad Hasan Kaman", email = "mohammadhasankaman@gmail.com" }]
requires-python = ">=3.9"
keywords = [
    "llm", "openai", "streaming", "sse", "debugging", "agents",
    "developer-tools", "diagnostics", "chatcompletions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agent-stream-doctor = "agent_stream_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/Mohammad-Hasan-Kaman/agent-stream-doctor"
Issues = "https://github.com/Mohammad-Hasan-Kaman/agent-stream-doctor/issues"

[tool.setuptools.packages.find]
where = ["src"]
